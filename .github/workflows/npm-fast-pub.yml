name: Publish Fast

on:
  push:
    tags: [ 'v*.*.*' ]
    branches: [ "pub" ]   

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: env    
      - run: npm ci
      - run: npm publish --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}